name: Build and Push Worker

on:
  push:
    branches:
      - main
    paths:
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "Dockerfile.worker"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/deploy-worker.yml"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: kids-utopia-worker

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate Image Tag
        id: vars
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker Image
        run: |
          docker build \
            -f Dockerfile.worker \
            -t $ECR_REPOSITORY:${{ steps.vars.outputs.IMAGE_TAG }} .

      - name: Tag Docker Image
        run: |
          docker tag \
            $ECR_REPOSITORY:${{ steps.vars.outputs.IMAGE_TAG }} \
            ${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${{ steps.vars.outputs.IMAGE_TAG }}

      - name: Push Docker Image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${{ steps.vars.outputs.IMAGE_TAG }}
